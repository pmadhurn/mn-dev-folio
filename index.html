    <!--
      The build injects a plain-HTML snapshot of the site inside #root for crawlers and
      no-JS clients (see scripts/prerender.ts). React clears it on mount, but on a cold
      load the browser painted that raw markup as unstyled text first. Flag JS support
      during head parse — before the body paints — and hide the snapshot. Clients that
      don't run JS never get `.js`, so they still receive the readable content, and the
      node stays inside #root so React's replaceChildren() still owns its removal.
    -->
    <script>document.documentElement.classList.add('js');</script>
    <style>html.js #static-content{display:none !important}</style>

  <body>
    <!-- Apply the saved theme before React mounts to avoid a light-mode flash -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) { /* localStorage unavailable */ }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
